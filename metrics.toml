# Settings for the profile metrics card (generated by `python -m metrics`).

[profile]
timezone = "America/New_York"   # decides what "today" and "this month" mean on the card
output_dir = "assets"

[privacy]
# Private repositories appear as "Private · <language>" unless this is true.
show_private_repo_names = false

[repos]
# Every repository your token can see is checked for commits you authored.
include = []   # "owner/name": always scan, even if GitHub doesn't attribute commits to you there
exclude = []   # "owner/name": never scan

[authorship]
# Your verified GitHub emails are discovered automatically. Add commit emails that
# are yours but not verified on your account (the workflow log suggests candidates).
emails = []

[lines]
# A single file changed by more than this in one commit is treated as generated or
# imported and skipped. A whole commit above max_commit_lines is skipped too.
max_file_lines = 5000
max_commit_lines = 15000
# Added to the built-in exclusions (lockfiles, vendored/build dirs, data files, ...).
exclude_dirs = []    # directory names, e.g. "generated"
exclude_files = []   # file-name globs, e.g. "*.pb.ts"
exclude_paths = []   # globs over "owner/repo/path", e.g. "Amxgh/website/assets/*"
exclude_commits = [] # commit SHAs (prefixes are fine) to leave out of line counts

[display]
top_repos = 5
top_languages = 6
