name: Metrics

on:
  schedule:
    - cron: "0 6 * * *" # daily, so date-based lines stay current on days without pushes
  workflow_dispatch: # watch.yml starts a run after you push to any repository
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # Bare clones of every scanned repository, so daily runs only fetch what's new.
      - name: Restore repository clones
        uses: actions/cache@v4
        with:
          path: .cache/repos
          key: metrics-repos-${{ github.run_id }}
          restore-keys: metrics-repos-

      # METRICS_TOKEN: classic personal access token with repo, read:org, read:user
      # and user:email scopes (authorize it for SSO if an organization requires that).
      - name: Generate cards
        run: python3 -m metrics
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "Cards unchanged"
            exit 0
          fi
          git commit -m "Update metrics cards [skip ci]"
          git push || { git pull --rebase && git push; }
