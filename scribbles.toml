    "{night}: maintenance mode, {beer} in hand, in bed.",
]
# there were commits yesterday
committed_yesterday = [
    "committed yesterday, so: gym.",
    "work done ahead of schedule. gym earned.",
]
# no commits yesterday
day_off_yesterday = [
    "no commits yesterday.",
    "yesterday: fun",
]
# this month had beer and caffeine (on different days)
caffeine_and_beer = [
    "caffeine and beer: never at the same time.",
    "red bull zero = building. beer = fixing.",
]
# 3 or more lattes this month
lattes = [
    "{lattes} venti lattes. 3 long shots each.",
    "{lattes} iced sf vanilla protein lattes. same order every time.",
