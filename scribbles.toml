# ---- Under the facts: what I was drinking, worked out from when I committed ------------
# The drinks rules live in metrics/fuel.py. The "latest coding day" groups only apply
# if it was in the last week.
#
# {day}            the latest coding day ("today", "yesterday", "monday": see [fuel.names])
# {night}          its night ("tonight", "last night", "monday night")
# {beer}           that day's beer (heineken, usually)
# {night_commits}  commits that night
# {lattes} {red_bulls} {beers}  drinks so far this month
# {pumps}          syrup pumps this month (lattes x pumps_per_latte)
[fuel]
pumps_per_latte = 8
# the latest coding day was a weekend (beer, no caffeine)
weekend = [
    "{day}: {beer}. no caffeine on weekends.",
    "{day}: weekend, so {beer}. that's the rule.",
    "{night}: {beer}, a few commits, no caffeine.",
]
# the latest coding day (a weekday) had a latte
latte = [
    "{day}: one iced venti latte. never two.",
    "{day}: on campus, iced latte in hand.",
    "{day}: venti latte. 3 long shots. 8 pumps.",
    "{day}: 4 vanilla, 4 caramel, all sugar free.",
    "{day}: iced venti sugar free vanilla protein latte.",
    "{day}: the usual. iced sf vanilla protein latte.",
    "+4 sf caramel, +4 sf vanilla, 3 long shots. always.",
]
# ...two red bulls that night
two_red_bulls = [
    "{night}: two red bull zeros. stuff got built.",
    "{night}: 2 red bull zeros, {night_commits} commits, from bed.",
]
# ...one red bull that night
red_bull = [
    "{night}: red bull zero. building mode.",
    "{night}: red bull zero + {night_commits} commits from bed.",
]
# ...worked straight through until it was done, then a beer
finished = [
    "{night}: worked till it was done. then {beer}.",
