# Everything the handwritten scribbles on the metrics card say.
#
# Each [section] is one spot on the card. Its lines are split into groups, and the
# comment above each group says when that group is used, e.g. only when last month
# had commits. Every run picks a new line from the groups that apply, so add or
# delete lines freely; a line only comes back once every other line in its pool has
# had a turn. Lines too long for their spot are skipped when the card is drawn.
#
# An empty group ( always = [] ) or a deleted one adds no lines; the section's other
# groups still apply. To switch a whole spot off but keep its lines for later, put
#     off = true
# right under its [section] heading. If none of a spot's groups have a line that
# applies, that spot gets no scribble.
#
#   {name}           fills in a value. Each section lists the names it has. Counts
#                    print with commas (1,234).
#   {name:one|many}  picks the word that agrees with a count:
#                    "{stars} {stars:star|stars}" gives "1 star" or "7 stars".
#                    Inside it, # is the number: "the other {n:one|#}".
#   {{ and }}        a literal { or }.
#
# Plain ASCII only (no emoji, curly quotes or accents): the handwriting font only
# has ASCII, so other lines are skipped. A mistake in a line (an unknown {name}, or a
# group name the code doesn't know) skips just that line or group, with a warning in
# the workflow log.


# ---- Beside the all-time commit count; the arrow points at "commits since" ----------
# A line is a string, or ["first line", "second line"] to split it over two lines.
#
# {commits}        all-time commits        {year}           this year, e.g. 2026
# {fixes}          commits that say "fix"  {non_fixes}      the commits that don't
# {this_year}      commits this year       {this_year_pct}  their share of all commits
# {night_pct}      % made after sunset     {active_days}    days with a commit
# {per_day}        commits per coding day  {streak}         longest run of days in a row
# {added}          lines added (12.9K)     {deleted}        lines deleted (12.9K)
# {net}            added minus deleted (12.9K)
[hero]
always = [
    "W git log",
    ["all of them", "were absolutely necessary"],
    ["ask me about", "literally any of them"],
    ["some of them", "even have tests"],
    ["every one of them", "pushed with hope"],
    ["a few of them", "were on purpose"],
    ["and i'd do it", "all again"],
    ["fueled by lattes,", "red bull zero and heineken"],
    ["headphones on.", "music off. locked in."],
    ["the easy ones were", "written to kiss land"],
    ["each one worth", "a cold heineken"],
    ["iced sf vanilla", "protein latte. always."],
    ["4 sf vanilla, 4 sf caramel,", "3 long shots"],
]
# a quarter or more of all commits came after sunset
night_owl = [
    ["{night_pct}% of them after sunset,", "from bed"],
    ["{night_pct}% written in bed.", "the rest on campus"],
]
# there's at least one commit
coding_days = [
    ["{active_days} days of this.", "and counting"],
]
# 4 or more commits per coding day on average
busy_days = [
    ["~{per_day} per coding day.", "LOCKED IN"],
]
# some commits, but not all of them, say "fix"
fixes = [
    ["{fixes} of them", "{fixes:fixes|fix} the other {non_fixes}"],
    ['{fixes} of them {fixes:says|say} "fix"', "the rest are lying"],
    ["{fixes} {fixes:fix|fixes},", "{non_fixes} future bugs"],
    ["{fixes} {fixes:says|say} fix.", "the rest will, eventually"],
    ["{fixes} {fixes:fix|fixes}.", "for very good reasons"],
]
# some commits, but not all of them, are from this year
this_year = [
    ["{this_year} of them", "{this_year:was|were} this year alone"],
]
# ...and this year has at least half of them
mostly_this_year = [
    ["{this_year_pct}% of them", "happened in {year}"],
    ["{year} has been", "a lot"],
]
# any lines deleted
deleted = [
    ["deleted {deleted} lines.", "my finest work"],
]
# more lines added than deleted
net_growth = [
    ["net +{net} lines.", "the codebase grows"],
]
# a streak of 5 or more days in a row
streak = [
    ["best streak: {streak} days.", "then i slept for too long"],
]


