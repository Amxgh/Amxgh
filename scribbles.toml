# What {day} and {night} say, depending on when the latest coding day was.
# {weekday} is its name, e.g. monday.
[fuel.names]
today = { day = "today", night = "tonight" }
yesterday = { day = "yesterday", night = "last night" }
earlier = { day = "{weekday}", night = "{weekday} night" }


