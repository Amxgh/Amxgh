# {commits}       commits this month         {month}         this month, e.g. November
# {last_commits}  commits last month         {last_month}    last month, e.g. October
# {today}         day of the month, e.g. 22  {today_nth}     the same as 22nd
# {days_left}     days left in the month
# {behind}        how many fewer than last month   {ahead}   how many more than last month
[month]
# no commits this month yet
nothing_yet = [
    "nothing yet. thinking very hard.",
    "I think i overslept.",
    "probably binging a new tv show",
    "probably rewatching a tv show",
    "out touching some grass",
    "out having fun!",
    "had a little too much fun watching an F1 race",
    "day {today}. the keyboard is warming up.",
]
# no commits this month yet, and last month had some
nothing_yet_vs_last_month = [
    "{last_month} had {last_commits}. recovering.",
    "{last_month} had {last_commits}. resting my fingers.",
    "{last_month}: {last_commits}. {month}: loading...",
]
# already the biggest month ever, with days still to go
record_so_far = [
    "my biggest month ever. it's the {today_nth}.",
    "personal record, and it's only the {today_nth}",
    "new high score.",
    "biggest month yet. {days_left} {days_left:day|days} to go.",
    "all-time record.",
    "record month. sleep schedule is in the bin.",
    "best month ever.",
    "record month. red bull zero stocks are low.",
]
# already the biggest month ever, with days still to go, and last month had commits
record_so_far_vs_last_month = [
    "{last_month} had {last_commits}.",
]
# the biggest month ever, on its last day
record = [
    "my biggest month ever.",
    "record month.",
    "new record.",
    "record month.",
]
# fewer commits than last month so far
behind_last_month = [
    "{last_month} had {last_commits}. catching up.",
    "{last_month} set the bar at {last_commits}. working on it.",
]
# already caught up with last month
ahead_of_last_month = [
    "already beat {last_month} ({last_commits}).",
    "{last_month} had {last_commits}.",
    "{ahead} ahead of {last_month}.",
]
# commits this month, none last month (and not a record)
none_last_month = [
    "first month on the board.",
    "and so it begins.",
    "off to a running start.",
]


